<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAINS - Digital Partners For Life</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Fira Code -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-start: #3b0000;
            --bg-mid: #800000;
            --bg-end: #ad000d;
            --btn-bg: #ffffff;
            --btn-text: #800000;
            --btn-border: #ff3344;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .mono-font {
            font-family: 'Fira Code', monospace;
        }

        /* Tech Cyber Grid Overlay */
        .tech-grid {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            animation: gridMove 45s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 50px 50px; }
        }

        /* Interactive Canvas */
        #aiDatabaseCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto; /* Enable touch & click interactions */
            z-index: 1;
        }

        /* Front UI Elements stack above interactive background */
        .ui-layer {
            position: relative;
            z-index: 10;
        }

        /* Action Buttons */
        .beacons-btn-red {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: 2px solid var(--btn-border);
            box-shadow: 0px 6px 0px rgba(30, 0, 0, 0.8), 0 0 15px rgba(255, 51, 68, 0.3);
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.35s ease, background-color 0.3s ease;
            position: relative;
            overflow: hidden;
            outline: none;
        }

        .beacons-btn-red::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: rotate(45deg) translateY(-100%);
            transition: transform 0.8s ease-in-out;
        }

        .beacons-btn-red:hover::before {
            transform: rotate(45deg) translateY(100%);
        }

        .beacons-btn-red:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0px 9px 0px rgba(30, 0, 0, 0.9), 0 0 25px rgba(255, 100, 100, 0.6);
            background-color: #ffffff;
        }

        /* Focus highlight for TV Remote / Keyboard Navigation */
        [data-focusable="true"]:focus {
            outline: 3px solid #ffffff !important;
            outline-offset: 3px !important;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.85), 0 0 0 2px rgba(255, 255, 255, 0.5) !important;
            transform: scale(1.03) translateY(-2px) !important;
            z-index: 30 !important;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(30, 0, 5, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 100, 100, 0.3);
        }
    </style>
</head>
<body class="relative flex flex-col justify-between items-center min-h-screen px-4 py-6 selection:bg-red-500 selection:text-white">

    <!-- Interactive AI & Touch Network Canvas -->
    <canvas id="aiDatabaseCanvas"></canvas>

    <!-- Animated Tech Grid Overlay -->
    <div class="fixed inset-0 tech-grid pointer-events-none z-0 opacity-30"></div>

    <!-- Main Container Layer -->
    <main class="ui-layer w-full max-w-md mx-auto flex flex-col items-center text-center space-y-6 my-auto pt-4 pb-16">
        
        <!-- Logo Box -->
        <div class="relative group mx-auto mb-1">
            <div class="absolute -inset-1 bg-gradient-to-r from-red-500 via-rose-500 to-amber-500 rounded-3xl blur-md opacity-60"></div>
            <div class="relative w-36 h-36 sm:w-44 sm:h-44 rounded-3xl overflow-hidden border-2 border-red-200/60 bg-white/95 backdrop-blur-md flex items-center justify-center p-4 shadow-2xl">
                <!-- Repository Reference logo.png -->
                <img id="displayAvatar" src="logo.png" alt="SAINS Logo" class="w-full h-full object-contain p-1 rounded-2xl" onerror="handleAvatarError()">
                
                <!-- Fallback Vector Logo -->
                <div id="svgLogoFallback" class="w-full h-full flex items-center justify-center text-slate-900 hidden">
                    <svg class="w-full h-full" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <g transform="translate(18, 8) scale(0.72)">
                            <path d="M 45 5 C 20 5 5 25 5 50 C 5 75 25 95 50 95 C 65 95 75 85 85 70 C 75 55 65 45 50 45 C 35 45 25 55 25 65 C 25 72 30 78 40 78 C 30 78 20 70 20 55 C 20 35 35 20 50 20 C 65 20 75 35 85 50 C 95 65 105 80 120 80 C 135 80 145 65 145 45 C 145 20 125 5 100 5 C 80 5 70 20 60 35 C 70 45 80 55 95 55 C 110 55 120 45 120 35 C 120 28 115 22 105 22 C 115 22 125 30 125 45 C 125 60 115 70 100 70 C 85 70 75 55 65 40 C 55 20 45 5 45 5 Z" fill="url(#sainsRedGrad)"/>
                            <defs>
                                <linearGradient id="sainsRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#e60012"/>
                                    <stop offset="50%" stop-color="#ff3344"/>
                                    <stop offset="100%" stop-color="#800000"/>
                                </linearGradient>
                            </defs>
                        </g>
                        <text x="70" y="118" font-family="'Inter', sans-serif" font-weight="900" font-size="24" fill="#0d0d0d" text-anchor="middle" letter-spacing="-1">sains</text>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Title & Exact Tagline -->
        <div class="space-y-2 px-2">
            <h1 class="text-xl sm:text-2xl lg:text-3xl font-extrabold tracking-tight text-white drop-shadow-md uppercase">
                Sarawak Information Systems (SAINS)
            </h1>
            <p class="text-sm sm:text-base text-red-100/90 leading-relaxed pt-1 max-w-sm mx-auto font-medium tracking-wide">
                Digital Partners For Life
            </p>
        </div>

        <!-- Social Bar -->
        <div class="flex items-center justify-center gap-4 text-xl sm:text-2xl pt-1">
            <a href="https://www.facebook.com/sainssarawak" target="_blank" data-focusable="true" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 border border-red-300/30 flex items-center justify-center text-white transition-all shadow-md">
                <i class="fa-brands fa-facebook"></i>
            </a>
            <a href="https://www.instagram.com/sainssarawak" target="_blank" data-focusable="true" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 border border-red-300/30 flex items-center justify-center text-white transition-all shadow-md">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://www.sains.com.my" target="_blank" data-focusable="true" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 border border-red-300/30 flex items-center justify-center text-white transition-all shadow-md">
                <i class="fa-solid fa-globe"></i>
            </a>
        </div>

        <!-- Exact 6 Requested Feature Boxes -->
        <div class="w-full space-y-4 pt-2 px-2">
            <button onclick="handleLinkExecution('Holobox (interactive AI Assistance)', '#holobox-backend')" data-focusable="true" class="beacons-btn-red w-full py-3.5 px-6 rounded-2xl flex items-center justify-center text-center">
                <h3 class="font-extrabold text-sm sm:text-base tracking-wide leading-snug">Holobox (interactive AI Assistance)</h3>
            </button>

            <button onclick="handleLinkExecution('S-Nexus', '#s-nexus-backend')" data-focusable="true" class="beacons-btn-red w-full py-3.5 px-6 rounded-2xl flex items-center justify-center text-center">
                <h3 class="font-extrabold text-sm sm:text-base tracking-wide leading-snug">S-Nexus</h3>
            </button>

            <button onclick="handleLinkExecution('Sovereign AI Infrastructure', '#sovereign-ai-backend')" data-focusable="true" class="beacons-btn-red w-full py-3.5 px-6 rounded-2xl flex items-center justify-center text-center">
                <h3 class="font-extrabold text-sm sm:text-base tracking-wide leading-snug">Sovereign AI Infrastructure</h3>
            </button>

            <button onclick="handleLinkExecution('The Future Sarawak Net', '#future-sarawak-net-backend')" data-focusable="true" class="beacons-btn-red w-full py-3.5 px-6 rounded-2xl flex items-center justify-center text-center">
                <h3 class="font-extrabold text-sm sm:text-base tracking-wide leading-snug">The Future Sarawak Net</h3>
            </button>

            <button onclick="handleLinkExecution('Unity IoT Platform', '#unity-iot-backend')" data-focusable="true" class="beacons-btn-red w-full py-3.5 px-6 rounded-2xl flex items-center justify-center text-center">
                <h3 class="font-extrabold text-sm sm:text-base tracking-wide leading-snug">Unity IoT Platform</h3>
            </button>

            <button onclick="handleLinkExecution('Neptune Studio', '#neptune-studio-backend')" data-focusable="true" class="beacons-btn-red w-full py-3.5 px-6 rounded-2xl flex items-center justify-center text-center">
                <h3 class="font-extrabold text-sm sm:text-base tracking-wide leading-snug">Neptune Studio</h3>
            </button>
        </div>

        <!-- Footer -->
        <footer class="pt-6 text-xs text-red-200/60 mono-font space-y-1">
            <p>© 2026 Sarawak Information Systems Sdn. Bhd.</p>
        </footer>
    </main>

    <!-- Modal Output Target -->
    <div id="itemModal" class="ui-layer fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-lg rounded-3xl p-6 space-y-4 relative shadow-2xl border border-red-500/40">
            <button onclick="closeModal('itemModal')" data-focusable="true" class="absolute top-4 right-4 w-9 h-9 bg-red-950 hover:bg-red-800 rounded-full flex items-center justify-center text-white border border-red-500/40">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-red-600/30 flex items-center justify-center text-red-400 border border-red-500/30">
                    <i class="fa-solid fa-cubes text-xl"></i>
                </div>
                <div>
                    <h3 id="modalTitle" class="font-bold text-lg text-white">System Service</h3>
                    <p class="text-xs text-red-200/80">SAINS Enterprise Portal System</p>
                </div>
            </div>

            <div class="bg-black/90 rounded-2xl p-4 font-mono text-xs text-slate-300 space-y-2 border border-red-900/60 min-h-[120px]">
                <p id="modalContent" class="text-slate-400">// Processing secure backend request...</p>
            </div>
        </div>
    </div>

    <!-- Interactive Canvas & Core Application Logic -->
    <script>
        // Clear old browser local storage cache to ensure clean updates
        localStorage.removeItem('sains_hub_config');

        window.onload = function() {
            initInteractiveCanvasAnimation();
            initKeyboardNavigation();
        };

        function handleAvatarError() {
            document.getElementById('displayAvatar').classList.add('hidden');
            document.getElementById('svgLogoFallback').classList.remove('hidden');
        }

        function handleLinkExecution(title, targetUrl) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalContent').innerText = `// Executing backend service request for: ${title}\n// Target Endpoint: ${targetUrl}`;
            document.getElementById('itemModal').classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        // --- Interactive Touch & Motion Canvas System ---
        function initInteractiveCanvasAnimation() {
            const canvas = document.getElementById('aiDatabaseCanvas');
            const ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            // Interactive Pointer State
            const pointer = {
                x: null,
                y: null,
                radius: 180,
                active: false
            };

            // Touch & Mouse Listeners
            function updatePointer(e) {
                const rect = canvas.getBoundingClientRect();
                if (e.touches && e.touches.length > 0) {
                    pointer.x = e.touches[0].clientX - rect.left;
                    pointer.y = e.touches[0].clientY - rect.top;
                    pointer.active = true;
                } else if (e.clientX !== undefined) {
                    pointer.x = e.clientX - rect.left;
                    pointer.y = e.clientY - rect.top;
                    pointer.active = true;
                }
            }

            function resetPointer() {
                pointer.active = false;
                pointer.x = null;
                pointer.y = null;
            }

            window.addEventListener('mousemove', updatePointer);
            window.addEventListener('touchmove', updatePointer, { passive: true });
            window.addEventListener('touchstart', updatePointer, { passive: true });
            window.addEventListener('mouseleave', resetPointer);
            window.addEventListener('touchend', resetPointer);

            // Interactive Ripples / Shockwaves
            const shockwaves = [];
            
            function triggerShockwave(x, y) {
                shockwaves.push({
                    x: x,
                    y: y,
                    radius: 5,
                    maxRadius: 180,
                    alpha: 1,
                    speed: 4
                });

                // Spawn energy burst particles on touch/click
                for (let i = 0; i < 8; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 3 + 1;
                    nodes.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        radius: Math.random() * 2.5 + 2,
                        pulse: Math.random() * Math.PI,
                        isBurst: true,
                        life: 120
                    });
                }
            }

            window.addEventListener('click', (e) => triggerShockwave(e.clientX, e.clientY));

            // Particle Network
            const nodes = [];
            const baseNodeCount = Math.min(Math.floor(window.innerWidth / 22), 50);

            for (let i = 0; i < baseNodeCount; i++) {
                nodes.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.9,
                    vy: (Math.random() - 0.5) * 0.9,
                    radius: Math.random() * 2 + 1.5,
                    pulse: Math.random() * Math.PI,
                    isBurst: false
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Render Active Shockwaves
                for (let i = shockwaves.length - 1; i >= 0; i--) {
                    const wave = shockwaves[i];
                    wave.radius += wave.speed;
                    wave.alpha -= 0.015;

                    if (wave.alpha <= 0 || wave.radius >= wave.maxRadius) {
                        shockwaves.splice(i, 1);
                        continue;
                    }

                    ctx.beginPath();
                    ctx.arc(wave.x, wave.y, wave.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(255, 120, 120, ${wave.alpha})`;
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                }

                // Node-to-Node Connections
                for (let i = 0; i < nodes.length; i++) {
                    for (let j = i + 1; j < nodes.length; j++) {
                        const dx = nodes[i].x - nodes[j].x;
                        const dy = nodes[i].y - nodes[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 130) {
                            ctx.beginPath();
                            ctx.moveTo(nodes[i].x, nodes[i].y);
                            ctx.lineTo(nodes[j].x, nodes[j].y);
                            ctx.strokeStyle = `rgba(255, 100, 100, ${ (1 - dist / 130) * 0.6 })`;
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        }
                    }
                }

                // Render & Update Nodes with Touch Attraction
                for (let i = nodes.length - 1; i >= 0; i--) {
                    const node = nodes[i];

                    // Gentle Physics Motion
                    node.x += node.vx;
                    node.y += node.vy;

                    // Touch / Pointer Physics Attraction & Connection
                    if (pointer.active && pointer.x !== null) {
                        const dx = pointer.x - node.x;
                        const dy = pointer.y - node.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < pointer.radius) {
                            // Draw direct glowing beam to touch/cursor position
                            ctx.beginPath();
                            ctx.moveTo(node.x, node.y);
                            ctx.lineTo(pointer.x, pointer.y);
                            ctx.strokeStyle = `rgba(255, 215, 0, ${(1 - dist / pointer.radius) * 0.95})`;
                            ctx.lineWidth = 1.2;
                            ctx.stroke();

                            // Subtle magnetic pull toward touch point
                            node.x += (dx / dist) * 0.6;
                            node.y += (dy / dist) * 0.6;
                        }
                    }

                    // Canvas Boundary bounce
                    if (node.x < 0 || node.x > canvas.width) node.vx *= -1;
                    if (node.y < 0 || node.y > canvas.height) node.vy *= -1;

                    // Handle temporary burst particles
                    if (node.isBurst) {
                        node.life--;
                        if (node.life <= 0) {
                            nodes.splice(i, 1);
                            continue;
                        }
                    }

                    // Glow Render
                    node.pulse += 0.04;
                    const currentRadius = node.radius + Math.sin(node.pulse) * 0.8;

                    ctx.beginPath();
                    ctx.arc(node.x, node.y, Math.max(1, currentRadius), 0, Math.PI * 2);
                    ctx.fillStyle = node.isBurst ? '#ffd700' : '#ff3344';
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = node.isBurst ? '#ffd700' : '#ff3344';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                // Draw Touch Focal Glow Indicator
                if (pointer.active && pointer.x !== null) {
                    ctx.beginPath();
                    ctx.arc(pointer.x, pointer.y, 8, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowBlur = 18;
                    ctx.shadowColor = '#ff3344';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                requestAnimationFrame(animate);
            }

            animate();
        }

        // TV Remote & Keyboard Navigation
        let focusables = [];
        let currentFocusIndex = 0;

        function updateFocusables() {
            focusables = Array.from(document.querySelectorAll('[data-focusable="true"]:not(.hidden)'));
        }

        function initKeyboardNavigation() {
            document.addEventListener('keydown', function(e) {
                updateFocusables();
                if (focusables.length === 0) return;

                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'Escape'].includes(e.key)) {
                    if (e.key !== 'Escape') e.preventDefault();
                }

                if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                    currentFocusIndex = (currentFocusIndex + 1) % focusables.length;
                    focusables[currentFocusIndex].focus();
                } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                    currentFocusIndex = (currentFocusIndex - 1 + focusables.length) % focusables.length;
                    focusables[currentFocusIndex].focus();
                } else if (e.key === 'Enter') {
                    if (document.activeElement && typeof document.activeElement.click === 'function') {
                        document.activeElement.click();
                    }
                } else if (e.key === 'Escape') {
                    closeModal('itemModal');
                }
            });
        }
    </script>
</body>
